[project]
name = "tasks"
version = "2.1.0"
description = "A simple command-line task list"
authors = [
    {name = "Marcus Kazmierczak", email = "marcus@mkaz.com"}
]
license = "MIT"
readme = "readme.md"
keywords = ["todo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "appdirs>=1.4",
    "rich>=13.3",
    "prompt-toolkit>=3.0.50",
]

[project.scripts]
tasks = "tasks.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
pythonpath = "tasks"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
